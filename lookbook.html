<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lookbook · Afterglow</title>
  <meta name="description" content="Lookbook de Afterglow: looks de maquillaje chrome, glitter y cyber beauty.">

  <!-- Modo oscuro: se aplica antes de pintar para evitar parpadeos -->
  <script>
    try {
      if (localStorage.getItem('tema') === 'oscuro') document.documentElement.classList.add('dark');
    } catch (e) {}
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">

  <!-- Tailwind CSS v4 (Play CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @custom-variant dark (&:where(.dark, .dark *));

    @theme {
      --color-tinta: #17171c;
      --color-papel: #f6f6f8;
      --color-rosa: #f0559f;
      --color-rosa-claro: #fbd0e4;
      --color-lila: #a78bfa;
      --color-lila-claro: #e4dcfd;
      --color-cielo: #c5e4fa;
      --color-cielo-claro: #eef7fe;
      --color-gris: #c9cacf;
      --color-pulso: #7c3aed;

      --font-titulo: "Bebas Neue", Impact, sans-serif;
      --font-texto: "Space Mono", ui-monospace, monospace;
    }
  </style>
  <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-tinta font-texto text-tinta antialiased">

  <a href="#contenido" class="sr-only focus:not-sr-only focus:fixed focus:left-2 focus:top-2 focus:z-[60] focus:rounded-full focus:bg-rosa focus:px-4 focus:py-2 focus:text-white">
    Saltar al contenido
  </a>

  <div class="relative mx-auto min-h-dvh w-full max-w-[430px] overflow-x-clip bg-papel dark:bg-tinta dark:text-papel">

    <!-- ============ CABECERA ============ -->
    <header class="sticky top-0 z-30 bg-papel/95 backdrop-blur dark:bg-tinta/95">
      <div class="px-3 pt-4 text-center">
        <a href="index.html" class="inline-block focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-pulso">
          <img src="img/logo.svg" alt="Afterglow" class="mx-auto h-12 w-auto dark:invert">
        </a>
      </div>
      <div class="relative flex h-14 items-center justify-between px-3">
        <button id="btn-menu" type="button" aria-label="Abrir menú" aria-controls="menu-lateral" aria-expanded="false"
                class="grid size-10 place-items-center rounded-full transition hover:bg-rosa-claro focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-pulso dark:hover:bg-pulso/40">
          <svg viewBox="0 0 24 24" class="size-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <p class="absolute left-1/2 -translate-x-1/2 font-titulo text-2xl tracking-wider">Lookbook</p>
        <button id="btn-tema" type="button" aria-label="Cambiar entre modo claro y oscuro"
                class="grid size-10 place-items-center rounded-full transition hover:bg-rosa-claro focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-pulso dark:hover:bg-pulso/40">
          <svg class="size-5 dark:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="hidden size-5 dark:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </header>

    <!-- ============ MENÚ HAMBURGUESA ============ -->
    <div class="pointer-events-none fixed inset-y-0 left-[max(0px,calc(50vw-215px))] z-50 w-full max-w-[430px] overflow-hidden">
      <div id="velo" class="pointer-events-auto absolute inset-0 hidden bg-black/60" aria-hidden="true"></div>
      <aside id="menu-lateral" aria-label="Menú" class="pointer-events-auto absolute inset-y-0 left-0 w-64 -translate-x-full bg-tinta p-6 text-papel transition-transform duration-300">
        <button id="btn-cerrar" type="button" aria-label="Cerrar menú" class="mb-8 grid size-10 place-items-center rounded-full transition hover:bg-pulso focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-rosa">
          <svg viewBox="0 0 24 24" class="size-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
        <nav aria-label="Principal">
          <ul class="space-y-5 font-titulo text-3xl tracking-wider">
            <li><a class="block transition hover:translate-x-2 hover:text-rosa focus-visible:text-rosa focus-visible:outline-none" href="index.html">Home</a></li>
            <li><a class="block transition hover:translate-x-2 hover:text-rosa focus-visible:text-rosa focus-visible:outline-none" href="shop.html">Shop</a></li>
            <li><a class="block text-rosa transition hover:translate-x-2 focus-visible:outline-none" href="lookbook.html" aria-current="page">Lookbook</a></li>
            <li><a class="block transition hover:translate-x-2 hover:text-rosa focus-visible:text-rosa focus-visible:outline-none" href="about.html">About</a></li>
            <li><a class="block transition hover:translate-x-2 hover:text-rosa focus-visible:text-rosa focus-visible:outline-none" href="visit-us.html">Visit us</a></li>
          </ul>
        </nav>
      </aside>
    </div>

    <main id="contenido" class="pb-10 pt-2">
      <h1 class="sr-only">Lookbook de Afterglow</h1>

      <!-- AÑADE AQUÍ tus imágenes: img/look-1.jpg ... img/look-4.jpg -->
      <div class="collage flex flex-col items-center">
        <figure class="w-[62%] overflow-hidden bg-lila-claro" data-aos="fade-up">
          <img src="img/look-1.jpg" alt="Look con ojos verdes y brillos en las cejas" class="aspect-[4/3] w-full object-cover" loading="eager">
        </figure>
        <figure class="w-full overflow-hidden bg-rosa-claro" data-aos="fade-up">
          <img src="img/look-2.jpg" alt="Look con estrellas rosas sobre la piel" class="aspect-[16/10] w-full object-cover">
        </figure>
        <figure class="w-[48%] overflow-hidden bg-cielo" data-aos="fade-up">
          <img src="img/look-3.jpg" alt="Look con delineado verde y labios glossy" class="aspect-[3/4] w-full object-cover">
        </figure>
        <figure class="w-full overflow-hidden bg-lila-claro" data-aos="fade-up">
          <img src="img/look-4.jpg" alt="Look con pendientes dorados y piel luminosa" class="aspect-[4/3] w-full object-cover">
        </figure>
      </div>
    </main>

    <!-- ============ FOOTER ============ -->
    <footer class="bg-tinta px-3 py-8 text-center text-sm text-papel dark:border-t dark:border-papel/10">
      <p class="font-titulo text-3xl tracking-wider">AFTERGLOW</p>
      <nav aria-label="Pie de página" class="my-4">
        <ul class="flex flex-wrap justify-center gap-x-5 gap-y-2">
          <li><a class="enlace-sub" href="shop.html">Shop</a></li>
          <li><a class="enlace-sub" href="lookbook.html">Lookbook</a></li>
          <li><a class="enlace-sub" href="about.html">About</a></li>
          <li><a class="enlace-sub" href="visit-us.html">Visit us</a></li>
        </ul>
      </nav>
      <p class="text-papel/60">&copy; 2026 Afterglow · Práctica 01 UDIT</p>
    </footer>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <script>AOS.init({ duration: 700, once: true });</script>
  <script src="js/menu.js"></script>
</body>
</html>
